
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esfinge Store</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #050b20;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 28px 10px;
  border-bottom: 2px solid #7024f5;
  margin-bottom: 25px;
}

header h1 {
  color: #08c9ff;
  font-size: 30px;
  text-shadow: 0 0 14px #087fea;
}

header p { color: #b7a0ff; }

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #7024f5;
  border-radius: 10px;
  background: #101a38;
  color: white;
  font-size: 16px;
  margin-bottom: 20px;
}

.category {
  background: #0b1530;
  border: 1px solid #7024f5;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 22px;
  box-shadow: 0 0 12px #35116c;
}

.category h2 {
  color: #08c9ff;
  text-shadow: 0 0 8px #087fea;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  color: #08c9ff;
  text-align: left;
}

th, td {
  padding: 12px 7px;
  border-bottom: 1px solid #26345b;
}

button {
  background: linear-gradient(90deg,#087fea,#7024f5);
  color: white;
  border: none;
  border-radius: 7px;
  padding: 9px 12px;
}

footer {
  text-align: center;
  color: #08c9ff;
  padding: 25px 5px;
}

@media(max-width:480px) {
  body { padding: 10px; }
  th, td { padding: 9px 4px; font-size: 12px; }
}
</style>
</head>

<body>

<header>
  <h1>ESFINGE STORE</h1>
  <p>CATÁLOGO ONLINE</p>
</header>

<input
  class="search"
  id="search"
  placeholder="Pesquisar..."
  oninput="render()"
>

<div id="catalog"></div>

<footer>
  ESFINGE STORE • SEMPRE ONLINE
</footer>

<script>
const products = [
  {
    category: "MÍDIAS",
    name: "Item 01",
    description: "Descrição do item",
    price: "R$ 00,00"
  },
  {
    category: "MÍDIAS",
    name: "Item 02",
    description: "Descrição do item",
    price: "R$ 00,00"
  },
  {
    category: "OUTROS",
    name: "Item 03",
    description: "Descrição do item",
    price: "R$ 00,00"
  }
];

function render() {
  const search = document
    .getElementById("search")
    .value.toLowerCase();

  const filtered = products.filter(p =>
    (p.name + p.category + p.description)
      .toLowerCase().includes(search)
  );

  const categories = [...new Set(
    filtered.map(p => p.category)
  )];

  document.getElementById("catalog").innerHTML =
    categories.map(category => {
      const items = filtered.filter(
        p => p.category === category
      );

      return `
        <section class="category">
          <h2>${category}</h2>
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${items.map(p => `
                <tr>
                  <td>${p.name}</td>
                  <td>${p.description}</td>
                  <td>${p.price}</td>
                  <td>
                    <button onclick="copyText('${p.name}')">
                      Copiar
                    </button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </section>
      `;
    }).join("");
}

function copyText(text) {
  navigator.clipboard.writeText(text)
    .then(() => alert("Copiado!"))
    .catch(() => alert("Não foi possível copiar."));
}

render();
</script>

</body>
</html>
