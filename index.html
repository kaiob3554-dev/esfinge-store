
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfinge Store</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #050b20;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 30px 10px;
  border-bottom: 2px solid #7024f5;
  margin-bottom: 25px;
}

header h1 {
  color: #08c9ff;
  font-size: 32px;
  text-shadow: 0 0 12px #087fea;
}

header p {
  color: #b7a0ff;
}

h2 {
  color: #08c9ff;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #7024f5;
  border-radius: 10px;
  background: #101a38;
  color: white;
  margin-bottom: 20px;
  font-size: 16px;
}

.category {
  border: 1px solid #7024f5;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 22px;
  background: #0b1530;
  box-shadow: 0 0 12px #35116c;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  color: #08c9ff;
  text-align: left;
  border-bottom: 1px solid #7024f5;
}

th, td {
  padding: 12px 7px;
  border-bottom: 1px solid #26345b;
}

td {
  color: #eee;
}

button {
  background: linear-gradient(90deg, #087fea, #7024f5);
  color: white;
  border: none;
  padding: 9px 12px;
  border-radius: 7px;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #08c9ff;
  padding: 25px 5px;
}
</style>
</head>

<body>

<header>
  <h1>ESFINGE STORE</h1>
  <p>Catálogo Online</p>
</header>

<input
  class="search"
  id="search"
  type="text"
  placeholder="Pesquisar produtos..."
  oninput="filterProducts()"
>

<div id="catalog"></div>

<footer>
  ESFINGE STORE • SEMPRE ONLINE
</footer>

<script>
const products = [
  {
    category: "Mídias",
    name: "Item 01",
    description: "Descrição do item",
    price: "R$ 00,00"
  },
  {
    category: "Mídias",
    name: "Item 02",
    description: "Descrição do item",
    price: "R$ 00,00"
  },
  {
    category: "Mídias",
    name: "Item 03",
    description: "Descrição do item",
    price: "R$ 00,00"
  },
  {
    category: "Outros",
    name: "Produto exemplo",
    description: "Descrição do produto",
    price: "R$ 00,00"
  }
];

function renderProducts(list) {
  const catalog = document.getElementById("catalog");
  catalog.innerHTML = "";

  const categories = [...new Set(list.map(p => p.category))];

  categories.forEach(category => {
    const items = list.filter(p => p.category === category);

    let html = `
      <section class="category">
        <h2>${category}</h2>
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Descrição</th>
              <th>Preço</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
    `;

    items.forEach(item => {
      html += `
        <tr>
          <td>${item.name}</td>
          <td>${item.description}</td>
          <td>${item.price}</td>
          <td>
            <button onclick="copyItem('${item.name}', '${item.price}')">
              Copiar
            </button>
          </td>
        </tr>
      `;
    });

    html += "</tbody></table></section>";
    catalog.innerHTML += html;
  });
}

function filterProducts() {
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(p =>
    (p.name + p.category + p.description)
      .toLowerCase()
      .includes(search)
  );

  renderProducts(filtered);
}

function copyItem(name, price) {
  navigator.clipboard.writeText(name + " - " + price)
    .then(() => alert("Copiado!"))
    .catch(() => alert("Não foi possível copiar."));
}

renderProducts(products);
</script>

</body>
</html>
