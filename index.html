<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050D2A">
<title>ESFINGE STORE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050D2A;
 color:#f4f5ff;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:35px 15px 28px;
 background:radial-gradient(circle,#102c67,#050D2A 75%);
 border-bottom:1px solid #3420a0;
}
.logo{
 width:75px;height:75px;
 margin:auto auto 15px;
 border:3px solid #7024F5;
 border-radius:50%;
 display:flex;align-items:center;
 justify-content:center;
 color:#08C9FF;
 font-size:45px;
 text-shadow:0 0 15px #08C9FF;
 box-shadow:0 0 25px #7024F5;
}
h1{
 margin:0;
 font-size:34px;
 letter-spacing:3px;
 color:#08C9FF;
 text-shadow:0 0 18px #087FEA;
}
.subtitle{
 color:#b5c9ff;
 letter-spacing:3px;
 font-size:14px;
}
.status{
 color:#bd8cff;
 font-size:13px;
}
main{
 max-width:950px;
 margin:auto;
 padding:20px 14px;
}
.search{
 width:100%;
 padding:15px;
 border:1px solid #087FEA;
 border-radius:12px;
 background:#0b1940;
 color:white;
 font-size:16px;
 outline:none;
}
.search:focus{border-color:#08C9FF}
.filters{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:16px 0;
}
.filter{
 white-space:nowrap;
 padding:10px 16px;
 border-radius:20px;
 border:1px solid #7024F5;
 background:#10183c;
 color:#d8c9ff;
 cursor:pointer;
}
.filter.active{
 background:linear-gradient(100deg,#087FEA,#7024F5);
 color:white;
}
.section{
 margin:15px 0;
 border:1px solid #263b83;
 border-radius:13px;
 overflow:hidden;
 background:#091633;
 box-shadow:0 0 15px #087FEA18;
}
.section h2{
 margin:0;
 padding:15px;
 background:linear-gradient(100deg,#102b65,#28115c);
 color:#08C9FF;
 font-size:18px;
}
.table-wrap{overflow-x:auto}
table{
 width:100%;
 min-width:430px;
 border-collapse:collapse;
}
th,td{
 padding:14px 11px;
 text-align:left;
 border-bottom:1px solid #1c315e;
}
th{
 color:#a9aaff;
 font-size:12px;
 text-transform:uppercase;
}
.price{
 color:#08C9FF;
 font-weight:bold;
 white-space:nowrap;
}
.copy{
 background:linear-gradient(100deg,#087FEA,#7024F5);
 color:white;
 border:0;
 border-radius:7px;
 padding:8px 12px;
 cursor:pointer;
}
.empty{
 display:none;
 text-align:center;
 padding:30px;
 color:#aab9e9;
}
footer{
 text-align:center;
 padding:25px;
 color:#8296c9;
 font-size:12px;
 border-top:1px solid #25205c;
}
</style>
</head>

<body>

<header>
<div class="logo">△</div>
<h1>ESFINGE</h1>
<div class="subtitle">S T O R E</div>
<p class="status">✦ CATÁLOGO OFICIAL ✦</p>
</header>

<main>

<input
 class="search"
 id="search"
 placeholder="⌕ Pesquisar produtos..."
>

<nav class="filters" id="filters"></nav>

<div id="catalog"></div>

<div class="empty" id="empty">
Nenhum produto encontrado.
</div>

</main>

<footer>
ESFINGE STORE © 2026
<br><br>
TECNOLOGIA • QUALIDADE • ESTILO
</footer>

<script>

// EDITE SEUS PRODUTOS AQUI

const products = [
{
 category:"Categoria 1",
 name:"Produto exemplo 1",
 detail:"Descrição do produto",
 price:"R$ 00,00"
},
{
 category:"Categoria 1",
 name:"Produto exemplo 2",
 detail:"Descrição do produto",
 price:"R$ 00,00"
},
{
 category:"Categoria 2",
 name:"Produto exemplo 3",
 detail:"Descrição do produto",
 price:"R$ 00,00"
},
{
 category:"Categoria 2",
 name:"Produto exemplo 4",
 detail:"Descrição do produto",
 price:"R$ 00,00"
}
];

let active="Todos";

const filters=document.getElementById("filters");
const catalog=document.getElementById("catalog");
const search=document.getElementById("search");
const empty=document.getElementById("empty");

function safe(text){
 return String(text).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

function renderFilters(){
 const categories=["Todos",...new Set(products.map(p=>p.category))];

 filters.innerHTML=categories.map(c=>
 `<button class="filter ${active===c?"active":""}" data-cat="${safe(c)}">${safe(c)}</button>`
 ).join("");

 filters.querySelectorAll("button").forEach(btn=>{
 btn.onclick=()=>{
 active=btn.dataset.cat;
 renderFilters();
 renderCatalog();
 };
 });
}

function renderCatalog(){
 const q=search.value.toLowerCase().trim();

 const visible=products.filter(p=>
 (active==="Todos"||p.category===active)&&
 [p.name,p.detail,p.price,p.category]
 .join(" ").toLowerCase().includes(q)
 );

 const groups=[...new Set(visible.map(p=>p.category))];

 catalog.innerHTML=groups.map(category=>{
 const items=visible.filter(p=>p.category===category);

 return `
 <section class="section">
 <h2>✦ ${safe(category)}</h2>
 <div class="table-wrap">
 <table>
 <thead>
 <tr>
 <th>Produto</th>
 <th>Detalhes</th>
 <th>Valor</th>
 <th>Ação</th>
 </tr>
 </thead>
 <tbody>
 ${items.map(p=>`
 <tr>
 <td>${safe(p.name)}</td>
 <td>${safe(p.detail)}</td>
 <td class="price">${safe(p.price)}</td>
 <td><button class="copy" data-copy="${safe(p.name+" - "+p.price)}">Copiar</button></td>
 </tr>
 `).join("")}
 </tbody>
 </table>
 </div>
 </section>
 `;
 }).join("");

 empty.style.display=visible.length?"none":"block";

 catalog.querySelectorAll(".copy").forEach(btn=>{
 btn.onclick=async()=>{
 try{
 await navigator.clipboard.writeText(btn.dataset.copy);
 btn.textContent="Copiado!";
 setTimeout(()=>btn.textContent="Copiar",1200);
 }catch(e){
 btn.textContent="Erro";
 }
 };
 });
}

search.addEventListener("input",renderCatalog);

renderFilters();
renderCatalog();

</script>
</body>
</html>
